<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
body {
    font-family: system-ui, sans-serif;
    padding: 24px;
    color: #1b1b1f;
}
#greeting {
    color: #3b82f6;
}
button {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    cursor: pointer;
}
#update-time {
    font-size: 14px;
    color: #666;
    margin: 0 0 16px 0;
}
.earthquake {
    padding: 5px 16px 16px 16px;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.earthquake h2 {
    margin: 8px 0;
}
.earthquake p {
    margin: 6px 0;
}
.earthquake h3 {
    margin: 12px 0;
}
.scale {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 8px;
    font-weight: bold;
    color: white;
    background: #808080;
    margin: 6px 0;
}

.未入電 { background: red;color: gold;}
.scale-1 { background: #6494ed;}
.scale-2 { background: #3cb371;}
.scale-3 { background: gold;color: #1b1b1f} 
.scale-4 { background: darkorange;color: #1b1b1f;} 
.scale-5 { background: #dc143c;color: white;}
.scale-6 { background: #ff1493; color: white;}
.scale-7 { background: #4b0082; color: gold;}

.issue-label {
    display: block;
    width: fit-content;
    padding: 5px 10px;
    margin-left: 0;
    margin-bottom: 6px;
    border-radius: 8px;
    background: #696969;
    color: white;
    font-size: 14px;
    font-weight: 700;
}

.tsunami-icon {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    margin: 6px 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
}

.tsunami-none {
    background: #696969;
    color: #ffffff;
}

.tsunami-checking {
    background: #696969;
    color: #ffffff;
}

.tsunami-NonEffective {
background: #87ceeb;
color: #ffffff;
}

.tsunami-watch {
    background: gold;
    color: #ffffff;
}

.tsunami-warning {
    background: red;
    color: #ffffff;
}

.tsunami-major-warning {
    background: #8a2be2;
    color: #ffffff;
}

.tsunami-unknown {
    background: 696969;
    color: #ffffff;
}

.earthquake {
    text-align: left;
}

.earthquake .scale {
    display: block;
    width: fit-content;
    margin-left: 0;
    margin-right: auto;
}
.earthquake {
    padding-top: 8px;
}

.earthquake .issue-label {
    display: block;
    margin-top: 0;
}

.earthquake .scale {
    margin-top: 0;
}

.earthquake .max-scale {
    margin-top: 5px;
}

.max-scale {
    padding: 8px 16px;
    font-size: 18px;
    border-radius: 10px;
    margin-top: 8px;
}
  </style>
</head>
<body>
<!doctype html>
<title>EQinfo</title>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>My Playground</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1 id="greeting">ⓘ各地の震度情報</h1>
        <p id="update-time"> --:--:-- 更新</p>
        <div id="result">読み込み中…</div>
        <script src="script.js"></script>
    </body>
</html>
  <script>
function scaleText(scale){
    const scales = {
        '-1': '未入電',
        10: '1',
        20: '2',
        30: '3',
        40: '4',
        45: '5-',
        50: '5+',
        55: '6-',
        60: '6+',
        70: '7'
    };
    return scales[scale] ?? '不明';
}

function scaleClass(scale) {
    const classes = {
        '-1':'未入電',
        10: 'scale-1',
        20: 'scale-2',
        30: 'scale-3',
        40: 'scale-4',
        45: 'scale-5',
        50: 'scale-5',
        55: 'scale-6',
        60: 'scale-6',
        70: 'scale-7'
    };
    return classes[scale] ?? 'scale';
}

function issueLabel(type) {
    const labels = {
        'ScalePrompt': 'ⓘ 震度速報',
        'Destination': 'ⓘ 震源情報',
    };
    return labels[type] ?? '';
}

function tsunamiText(value) {
    const tsunami = {
        'None': '津波の心配なし',
        'Checking': '津波調査中',
        'NonEffective': '若干の海面変動',
        'Watch': '津波注意報',
        'Warning': '津波警報',
        'MajorWarning': '大津波警報'
    };

    return tsunami[value] ?? '津波不明';
}

function tsunamiClass(value) {
    const classes = {
        'None': 'tsunami-none',
        'Checking': 'tsunami-checking',
        'NonEffective': 'tsunami-none',
        'Watch': 'tsunami-watch',
        'Warning': 'tsunami-warning',
        'MajorWarning': 'tsunami-major-warning'
    };

    return classes[value] ?? 'tsunami-unknown';
}

function updateEarthquake() {
    fetch('https://api.p2pquake.net/v2/history?codes=551&limit=5')
        .then(response => response.json())
        .then(data => {
            const now = new Date();
            let html = '';

            data.forEach((item, index) => {
                const points = item.points;
                let itemMaxScale = points[0]?.scale ?? null;

                points.forEach(point => {
                    if (point.scale > itemMaxScale) {
                        itemMaxScale = point.scale;
                    }
                });

                const place = item.earthquake.hypocenter.name ?? '調査中';
const issueType = item.issue.type;

const magnitudeValue =
    item.earthquake.hypocenter.magnitude;

const depthValue =
    item.earthquake.hypocenter.depth;

const magnitude =
    magnitudeValue == null || magnitudeValue < 0
        ? '調査中'
        : magnitudeValue.toFixed(1);

const depth =
    depthValue == null || depthValue < 0
        ? '調査中'
        : depthValue === 0
        ? 'ごく浅い'
        : depthValue + 'km';

const time =
    item.earthquake.time ?? '調査中';

const tsunami =
    item.earthquake.domesticTsunami ?? 'Unknown';   

                html += `<div class="earthquake">`;

if (issueLabel(issueType)) {
    html += `<div class="issue-label">${issueLabel(issueType)}</div>`;
}

                if (
                    issueType !== 'ScalePrompt' &&
                    issueType !== 'Destination'
                ) {
                html += `<div class="scale max-scale ${scaleClass(itemMaxScale)}">最大震度 ${scaleText(itemMaxScale)}</div>`;
                }
       
                html += `<p>${time} ごろ</p>
                    <h3>${place}</h3>`;

                if (issueType !== 'ScalePrompt') {
                    html += `<p>で地震がありました</p>
                    <h3>
                        マグニチュード ${magnitude}
                        ・深さ: ${depth}
                    </h3>`;
                }
            if (issueType !== 'ScalePrompt') {
    html += `
        <div class="tsunami-icon ${tsunamiClass(tsunami)}">
            <span>${tsunamiText(tsunami)}</span>
        </div>
    `;
}
                if (issueType !== 'Destination') {
                    html += `<p>
                        ＊各地の震度は以下の通りです＊
                    </p>`;

                    const sortedPoints = [...points].sort(
                        (a, b) => b.scale - a.scale
                    );

                    let currentScale = null;
                    let currentPref = '';

                    sortedPoints.forEach(point => {

                        if (point.scale !== currentScale) {
                            html += `<div class="scale ${scaleClass(point.scale)}">
                                震度 ${scaleText(point.scale)}
                            </div>`;

                            currentScale = point.scale;
                            currentPref = '';
                        }

                        if (point.pref !== currentPref) {
                            html += `<h3>-${point.pref}-</h3>`;
                            currentPref = point.pref;
                        }

                        html += `<p>${point.addr}</p>`;
                    });
                }

                html += `</div>`;
            });

            document.getElementById('update-time').textContent =
                now.toLocaleTimeString() + ' 更新';

            document.getElementById('result').innerHTML = html;
        });
}

updateEarthquake();
setInterval(updateEarthquake, 1000);

  </script>
</body>
</html>
